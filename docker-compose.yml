services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tax_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-tax_db}
    ports:
      - "5433:5432"   # 외부 DB 클라이언트용 (pgAdmin 등)
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tax_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI 백엔드 ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tax_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker 내부에서는 서비스명(postgres)으로 접속
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tax_db}
      # WSL 실행 스크립트가 현재 Windows 게이트웨이를 아래 별칭에 연결한다.
      OLLAMA_BASE_URL: http://ollama.windows.host:11434
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # WSL2 NAT의 Windows 호스트 IP는 재시작 시 바뀔 수 있으므로 하드코딩하지 않는다.
      - "ollama.windows.host=${OLLAMA_WINDOWS_IP:?dev/docker-up-wsl.sh를 통해 실행하세요}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React 프론트엔드 (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tax_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── pgAdmin (DB 관리 UI) ───────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: tax_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgvector_data:

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tax_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-tax_db}
    ports:
      - "5433:5432"   # 외부 DB 클라이언트용 (pgAdmin 등)
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tax_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI 백엔드 ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tax_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker 내부에서는 서비스명(postgres)으로 접속
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tax_db}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # 컨테이너 → 호스트 머신 Ollama 접근 (Linux에서 host.docker.internal 미지원 시 대비)
      - "host.docker.internal:host-gateway"

  # ── React 프론트엔드 (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tax_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── pgAdmin (DB 관리 UI) ───────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: tax_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgvector_data:
